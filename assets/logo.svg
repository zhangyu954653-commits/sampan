<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Sampan">
  <title>Sampan</title>
  <!-- 桅杆 -->
  <line x1="64" y1="14" x2="64" y2="86" stroke="#6B7785" stroke-width="4" stroke-linecap="round"/>
  <!-- 左帆：红色对话气泡（中文） -->
  <rect x="16" y="20" width="44" height="34" rx="10" fill="#E5484D"/>
  <path d="M42 52 L58 52 L60 66 Z" fill="#E5484D"/>
  <line x1="26" y1="32" x2="50" y2="32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="42" x2="42" y2="42" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 右帆：蓝色对话气泡（泰文） -->
  <rect x="68" y="32" width="44" height="32" rx="10" fill="#3E7BFA"/>
  <path d="M70 62 L86 62 L68 76 Z" fill="#3E7BFA"/>
  <line x1="78" y1="44" x2="102" y2="44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="53" x2="94" y2="53" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 船身：两头上翘的舢板 -->
  <path d="M10 76 C14 90 21 98 32 98 L96 98 C107 98 114 90 118 76 C111 82 104 85 96 85 L32 85 C24 85 17 82 10 76 Z" fill="#B26B2E"/>
  <!-- 水波 -->
  <path d="M8 111 C18 105 28 117 40 111 S62 105 74 111 S96 117 108 111 S116 107 120 109" fill="none" stroke="#3BA7E0" stroke-width="5" stroke-linecap="round"/>
</svg>
